# Coolify: Build pack "Docker Compose", base directory `/`, compose file `docker-compose.yml`.
# 1) In the resource UI, open service `web` → Domains → e.g. https://vapen.example.com:3000
#    (public URL stays https://vapen.example.com; :3000 is the container listen port — required.)
# 2) Environment: JWT_ED25519_PRIVATE_KEY (go run ./cmd/vapen-api keygen from api/).
#    Optional but recommended: ORIGIN=https://vapen.example.com, PUBLIC_BASE_URL same (no :3000).
# 3) "No available server": Traefik skips containers Docker marks unhealthy.
#    api probes GET /healthz, web probes GET /health (wget). Both need the start_period to pass.
#    Advanced: do NOT enable "Connect To Predefined Network" unless you know why (breaks routing).
# API is reached via Coolify/Traefik (api domain) or web BFF; no host port publish (8080 often taken on shared hosts).
# Local dev: add `ports: ["8080:8080"]` under api in docker-compose.override.yml (see .gitignore).

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vapen}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:-vapen}
      POSTGRES_DB: ${POSTGRES_DB:-vapen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vapen} -d ${POSTGRES_DB:-vapen}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vapen}:${SERVICE_PASSWORD_64_POSTGRES:-vapen}@postgres:5432/${POSTGRES_DB:-vapen}?sslmode=disable
      LISTEN_ADDR: ":8080"
      JWT_ED25519_PRIVATE_KEY: ${JWT_ED25519_PRIVATE_KEY:?}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-${ORIGIN:-http://localhost:3000}}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        ORIGIN: ${ORIGIN:-http://localhost:3000}
        COOLIFY_FQDN: ${COOLIFY_FQDN:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      # Coolify: path suffix for generated SERVICE_URL_WEB_3000 (do not use that var as ORIGIN — it may be "/").
      SERVICE_URL_WEB_3000: /
      API_INTERNAL_URL: http://api:8080
      # Set ORIGIN in Coolify env to override; COOLIFY_FQDN is injected on deploy.
      ORIGIN: ${ORIGIN:-https://${COOLIFY_FQDN:-localhost:3000}}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-dev.vapen.app}
      ANDROID_CERT_SHA256_FINGERPRINTS: ${ANDROID_CERT_SHA256_FINGERPRINTS:-}

  caddy:
    profiles: [caddy]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      VAPEN_DOMAIN: ${VAPEN_DOMAIN:-localhost}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
