              type: string
              enum: [status]
            recorded_at:
              type: string
              format: date-time
            battery_percent:
              type: integer
              minimum: 0
              maximum: 100
            is_charging:
              type: boolean
            liquid_percent:
              type: integer
              minimum: 0
              maximum: 100
            puff_counter_total:
              type: integer
            power_mode:
              type: string
            child_lock:
              type: boolean
            firmware_version:
              type: string
