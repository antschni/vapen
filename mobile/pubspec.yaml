name: vapen
description: Vapen mobile app — Elfbar Master tracking and Vapen API client.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  fl_chart: ^0.70.2
  mobile_scanner: ^6.0.6
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  intl: ^0.20.2
  collection: ^1.19.1
  uuid: ^4.5.1
  http: ^1.3.0
  permission_handler: ^11.4.0
  flutter_timezone: ^4.1.0
  crypto: ^3.0.6
  app_links: ^6.4.0
  vapen_api:
    path: packages/vapen_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  pigeon: ^25.3.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
