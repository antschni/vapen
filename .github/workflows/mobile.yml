name: mobile

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run pigeon --input pigeons/vapen_native.dart
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: mobile/packages/vapen_api
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
