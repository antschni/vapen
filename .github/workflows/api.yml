name: api

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Generate
        run: go generate ./...
      - name: Check generated diff
        run: git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /dev/null ./...
